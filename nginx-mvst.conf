    # ── Fichiers PHP ──────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php-mvst:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Endpoint Node.js : réinitialisation PIN ────────────────────────────
    location /reinitialiser_pin {
        proxy_pass http://socket-mvst:3000/reinitialiser_pin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
    }

    # ── Images uploadees (audit performance, tache 4, 26/08/2026) ──────────
    # Immuables une fois uploadees : un nouvel upload cree toujours un nouveau
    # nom de fichier (uniqid()), jamais de remplacement en place. Cache long
    # sans risque de servir une version perimee.
    #
    # ATTENTION (constat fait en verifiant ce bloc, plus grave que le sujet
    # cache lui-meme) : "root" pointe sur php-mvst/app (bind-mount ci-dessous),
    # pas sur backend-mvst/app/public/uploads. Depuis la bascule Nginx de
    # gestionImages.php vers Laravel, les nouvelles images sont ecrites dans
    # backend-mvst/app/public/uploads/, un dossier que ce conteneur Nginx ne
    # monte pas du tout -- elles seraient donc introuvables (404) via ce bloc.
    # Verifie : la derniere image en base date du 30/05/2026, avant la bascule
    # -- aucun upload reel n'a encore transite par Laravel, le probleme est
    # latent, pas encore constate en production. Ce cache HTTP est ajoute sur
    # le chemin existant (qui sert correctement les images pre-bascule) ; la
    # divergence de chemin de stockage est un probleme distinct, plus large
    # qu'un ajout d'en-tete (implique un partage de volume Docker entre
    # nginx-mvst et backend-mvst), a trancher separement avant le prochain
    # upload admin.
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Fichiers statiques ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Sécurité — bloquer accès aux fichiers sensibles ───────────────────
    location ~ /\. {
        deny all;
    }
